name: BrightForge Photo — Web deployment

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to bfp.brightforgestudio.workers.dev (requires Cloudflare secrets)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: bfp-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the BrightForge Photo fork
        uses: actions/checkout@v4

      - name: Download the complete upstream PhotoCraft v0.23.1 web engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloaded
          gh release download v0.23.1 \
            --repo storytold/photocraft \
            --pattern 'photocraft-web-*.zip' \
            --dir downloaded
          test "$(find downloaded -maxdepth 1 -name 'photocraft-web-*.zip' | wc -l)" -eq 1

      - name: Assemble full branded website from published browser build
        run: |
          python3 scripts/prepare-bfp-site.py downloaded/photocraft-web-*.zip site
          test -f site/index.html
          test -f site/app/parts.txt
          test -f site/manifest.webmanifest

      - name: Upload complete website for inspection or manual deployment
        uses: actions/upload-artifact@v4
        with:
          name: brightforge-photo-website
          path: site/
          if-no-files-found: error
          retention-days: 7

      - name: Deploy the complete site to Cloudflare Workers
        if: ${{ inputs.deploy == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID repository secret'; exit 1; }
          npx --yes wrangler@4 deploy --config wrangler.jsonc
          echo 'Deployment requested for https://bfp.brightforgestudio.workers.dev/'
